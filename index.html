<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한문 퀴즈</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:850px;margin:auto;padding:14px}
section{background:white;border:1px solid #dce2eb;border-radius:14px;padding:15px;margin-bottom:12px}
h1{font-size:26px;margin:0 0 5px}h2{font-size:17px;margin:0 0 12px}
.small{font-size:12px;color:#667085}
select,input{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:white;max-width:100%}
select{width:100%;margin-top:5px}
label.field{display:block;font-size:13px;margin-bottom:10px}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;min-height:42px;cursor:pointer}
.primary{background:#2457d6;color:white}.secondary{background:#edf0f5;color:#344054}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#ranges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.group{border:1px solid #dce2eb;border-radius:10px;padding:9px}
.group b{display:block;font-size:13px;margin-bottom:7px}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.checks label{font-size:12px;display:flex;align-items:center;gap:4px;background:#f5f7fa;border-radius:6px;padding:6px}
.checks input{margin:0;padding:0}
#question{font-size:48px;text-align:center;margin:18px 0;font-weight:bold}
#feedback{white-space:pre-line;line-height:1.7;margin-top:10px}
.hidden{display:none!important}
@media(max-width:600px){main{padding:8px}section{padding:11px}#ranges{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
<h1>한문 퀴즈</h1>
<p class="small">범위 선택 · 음 쓰기 · 전체 뜻 쓰기</p>
</header>

<section>
<h2>퀴즈 설정</h2>
<label class="field">문제 종류
<select id="kind">
<option value="char">글자</option>
<option value="word">단어</option>
<option value="idiom">사자성어</option>
</select>
</label>
<label class="field">문제 유형
<select id="mode">
<option value="reading">음 쓰기</option>
<option value="meaning">전체 뜻 쓰기</option>
<option value="order">풀이 순서 맞히기</option>
</select>
</label>
<label class="field">출제 순서
<select id="order">
<option value="random">무작위</option>
<option value="list">목록 순</option>
</select>
</label>
</section>

<section>
<h2>범위 선택</h2>
<p class="small">아래 범위는 스크립트가 실행되기 전에도 표시됩니다.</p>

<div id="ranges">
  <div class="group">
    <b>글자</b>
    <div class="checks">
      <label><input type="checkbox" class="range" data-kind="char" checked>전체 글자</label>
    </div>
  </div>
  <div class="group">
    <b>단어</b>
    <div class="checks">
      <label><input type="checkbox" class="range" data-kind="word" checked>전체 단어</label>
    </div>
  </div>
  <div class="group">
    <b>사자성어</b>
    <div class="checks">
      <label><input type="checkbox" class="range" data-kind="idiom" checked>전체 사자성어</label>
    </div>
  </div>
</div>

<p id="summary" class="small">범위 목록을 불러오는 중입니다.</p>
<div class="row">
<button class="secondary" id="selectAll">전체 선택</button>
<button class="secondary" id="clearAll">선택 해제</button>
<button class="primary" id="start">퀴즈 시작</button>
</div>
</section>

<section id="quiz" class="hidden">
<div class="small" id="progress"></div>
<div id="question"></div>
<div id="hint" class="small"></div>
<div class="row">
<input id="answer" type="text" placeholder="정답 입력" autocomplete="off">
<button id="check" class="primary">확인</button>
<button id="next" class="secondary hidden">다음</button>
</div>
<div id="feedback"></div>
<div class="row" style="margin-top:10px">
<button id="previous" class="secondary">이전</button>
<button id="exit" class="secondary">설정으로</button>
</div>
</section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const chars = [
["禾","벼","화"],["象","코끼리","상"],["木","나무","목"],
["斤","도끼","근"],["析","쪼갤","석"],["水","물","수"],
["田","밭","전"],["畓","논","답"],["人","사람","인"],
["大","큰","대"],["小","작을","소"],["心","마음","심"],
["日","날","일"],["月","달","월"],["山","뫼","산"],
["草","풀","초"],["朋","벗","붕"],["友","벗","우"]
].map(x=>({hanja:x[0],reading:x[2],meaning:x[1],kind:"char"}));

const words = [
["象形","상형","사물의 모양을 본떠 만든 한자"],
["指事","지사","추상적인 개념이나 일을 부호로 나타낸 한자"],
["會意","회의","둘 이상의 한자를 결합해 뜻을 나타낸 한자"],
["形聲","형성","뜻을 나타내는 부분과 소리를 나타내는 부분을 결합한 한자"],
["登山","등산","산에 오름"],
["日月","일월","해와 달"],
["肝膽","간담","간과 쓸개"],
["草木","초목","풀과 나무"],
["自足","자족","스스로 만족함"],
["生死","생사","삶과 죽음"],
["朋友","붕우","벗과 친구"],
["主導","주도","주장이 되어 이끌어 감"],
["抵抗","저항","어떤 힘이나 작용에 맞섬"],
["問安","문안","안부를 물음"],
["通稱","통칭","일반적으로 널리 부름"],
["警察","경찰","사회의 안전과 질서를 지키는 기관 또는 사람"],
["逮捕","체포","죄를 지은 혐의가 있는 사람을 붙잡음"],
["醫師","의사","환자를 진료하고 치료하는 사람"],
["治療","치료","병이나 상처를 낫게 함"],
["祝賀","축하","기쁜 일을 함께 기뻐함"],
["感謝","감사","고마움을 느낌"],
["討論","토론","여러 사람이 의견을 말하며 논의함"],
["水泳","수영","물속에서 헤엄침"],
["洪水","홍수","큰물이 나서 넘침"],
["漢字","한자","한자로 이루어진 문자"]
].map(x=>({hanja:x[0],reading:x[1],meaning:x[2],kind:"word"}));

const idioms = [
["溫故知新","온고지신","옛것을 익히고 그것을 바탕으로 새것을 앎"],
["伯牙絶絃","백아절현","자기를 알아주는 벗의 죽음을 슬퍼함"],
["兔死狗烹","토사구팽","필요할 때 쓰고 일이 끝나면 버림"],
["天高馬肥","천고마비","하늘이 높고 말이 살찐다는 가을의 풍요로운 모습"],
["不恥下問","불치하문","자기보다 못하다고 여기는 사람에게 묻는 것을 부끄러워하지 않음"],
["一舉兩得","일거양득","한 가지 일로 두 가지 이익을 얻음"],
["管鮑之交","관포지교","서로를 깊이 이해하고 믿는 우정"],
["背水之陣","배수진","물러설 곳 없이 결전을 각오한 진형"],
["四面楚歌","사면초가","사방이 적에게 둘러싸여 도움을 받기 어려운 상황"],
["指鹿為馬","지록위마","윗사람을 속이고 사실을 왜곡함"],
["螢雪之功","형설지공","어려운 환경에서도 열심히 공부해 이룬 성과"],
["守株待兔","수주대토","한 가지 방법만 고집하며 요행을 기다림"],
["愚公移山","우공이산","꾸준히 노력하면 큰일도 이룰 수 있음"],
["畫蛇添足","화사첨족","불필요한 일을 더해 오히려 일을 그르침"],
["群鷄一鶴","군계일학","많은 평범한 사람 가운데 뛰어난 한 사람"],
["脣亡齒寒","순망치한","서로 의지하는 관계에서 한쪽이 망하면 다른 쪽도 위험함"]
].map(x=>({hanja:x[0],reading:x[1],meaning:x[2],kind:"idiom"}));

const all={char:chars,word:words,idiom:idioms};
const kindNames={char:"글자",word:"단어",idiom:"사자성어"};
let questions=[],index=0,answered=false,history=[],lastQuestions=[];

function updateSummary(){
  const selected=[...document.querySelectorAll(".range:checked")].map(x=>x.dataset.kind);
  $("summary").textContent="선택된 종류: "+(selected.length?selected.map(x=>kindNames[x]).join(", "):"없음");
}
document.querySelectorAll(".range").forEach(x=>x.addEventListener("change",updateSummary));

$("selectAll").onclick=()=>{
  document.querySelectorAll(".range").forEach(x=>x.checked=true);
  updateSummary();
};
$("clearAll").onclick=()=>{
  document.querySelectorAll(".range").forEach(x=>x.checked=false);
  updateSummary();
};

function startQuiz(){
  const kind=$("kind").value;
  const checked=[...document.querySelectorAll(".range:checked")].map(x=>x.dataset.kind);
  if(!checked.includes(kind)){
    alert("선택한 문제 종류의 범위를 체크해 주세요.");
    return;
  }
  questions=[...all[kind]];
  if($("order").value==="random"){
    questions.sort(()=>Math.random()-.5);
  }
  lastQuestions=[...questions];
  index=0;
  history=questions.map(()=>({status:"",input:""}));
  $("quiz").classList.remove("hidden");
  renderQuestion();
}
function renderQuestion(){
  if(index>=questions.length){
    $("question").textContent="퀴즈 완료!";
    $("hint").textContent="모든 문제를 풀었습니다.";
    $("answer").classList.add("hidden");
    $("check").classList.add("hidden");
    $("next").classList.add("hidden");
    $("progress").textContent=`완료: ${questions.length}문제`;
    return;
  }
  answered=!!history[index].status;
  const q=questions[index];
  $("progress").textContent=`${kindNames[q.kind]} · ${index+1}/${questions.length}`;
  $("question").textContent=q.hanja;
  $("hint").textContent=$("mode").value==="meaning"?"전체 뜻을 입력하세요.":"한자어의 음을 입력하세요.";
  $("answer").classList.remove("hidden");
  $("answer").value=history[index].input;
  $("answer").disabled=answered;
  $("check").classList.toggle("hidden",answered);
  $("next").classList.toggle("hidden",!answered);
  $("feedback").textContent=answered?
    (history[index].status==="correct"?"정답입니다!":"정답: "+($("mode").value==="meaning"?q.meaning:q.reading)):"";
  $("answer").focus({preventScroll:true});
}
function checkAnswer(){
  if(answered)return;
  const q=questions[index];
  const typed=$("answer").value.trim().replace(/\s+/g,"");
  const expected=($("mode").value==="meaning"?q.meaning:q.reading).replace(/\s+/g,"");
  const correct=typed===expected;
  history[index]={status:correct?"correct":"wrong",input:$("answer").value};
  answered=true;
  $("feedback").textContent=correct?"정답입니다!":"정답: "+expected;
  $("answer").disabled=true;
  $("check").classList.add("hidden");
  $("next").classList.remove("hidden");
}
$("start").onclick=startQuiz;
$("check").onclick=checkAnswer;
$("next").onclick=()=>{
  index++;
  renderQuestion();
};
$("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    if(!answered)checkAnswer();
    else{index++;renderQuestion();}
  }
});
$("previous").onclick=()=>{
  if(index>0){index--;renderQuestion();}
};
$("exit").onclick=()=>{
  $("quiz").classList.add("hidden");
  $("answer").classList.remove("hidden");
  $("answer").disabled=false;
};
updateSummary();
</script>
</body>
</html>
