
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>한문 퀴즈</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182230;--muted:#667085;--line:#d9e0ea;--blue:#2457d6;--bluebg:#eaf0ff;--green:#18794e;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{max-width:900px;margin:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h1{font-size:27px;margin:0}h2{font-size:17px;margin:0 0 12px}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.field{display:block;font-size:12px;font-weight:750;color:#475467}
select{display:block;width:100%;margin-top:6px;min-height:43px;padding:8px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}
button{border:0;border-radius:10px;padding:11px 14px;min-height:42px;font-weight:750}
.primary{background:var(--blue);color:white}.secondary{background:#edf1f7;color:#344054}.outline{background:white;border:1px solid var(--line);color:#344054}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
.range-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.range-group{border:1px solid var(--line);border-radius:11px;padding:9px}
.range-group h3{font-size:13px;margin:0 0 8px}
.ranges{display:flex;flex-wrap:wrap;gap:6px}
.ranges label{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px}
.ranges input{margin:0;accent-color:var(--blue)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}
.progress{height:5px;background:#edf0f5;border-radius:9px;margin:10px 0 14px;overflow:hidden}
.progress div{height:100%;background:var(--blue);width:0}
.prompt-label{text-align:center;color:var(--muted);font-size:12px}
.prompt{text-align:center;font-size:clamp(38px,9vw,64px);font-weight:850;margin:8px 0 12px;font-family:"Noto Serif CJK KR","Batang",serif;word-break:keep-all}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:0 0 12px}
.glosses{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
.gloss{border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:9px 11px;text-align:center;min-width:65px}
.gloss b{display:block;font-size:20px}.gloss span{font-size:12px;color:#475467}
.answer-row{display:flex;gap:7px}
.answer-row input{min-width:0;flex:1;width:100%;border:2px solid #cbd5e1;border-radius:11px;padding:12px;font-size:17px;min-height:51px;outline:none}
.answer-row input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2457d61a}
.answer-row button{min-width:85px}
.feedback{margin-top:10px;padding:11px;border-radius:11px;font-size:14px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.correct{background:#e9f7ef;color:#17633d}.wrong{background:#fff0ef;color:#8d2119}.neutral{background:#f0f3f8;color:#344054}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.result-item{background:white;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:8px;font-size:13px;line-height:1.6}
.tag{display:inline-block;background:#f1f5f9;border-radius:6px;padding:3px 6px;margin:2px}
@media(max-width:650px){
 .app{padding:9px 9px calc(14px + env(safe-area-inset-bottom))}
 .grid,.range-groups{grid-template-columns:1fr}
 .panel,.card{padding:11px}
 .prompt{margin:5px 0 9px}
 .glosses{gap:5px;margin:8px 0}
 .gloss{padding:7px;min-width:55px}
 .answer-row{gap:5px}
 .answer-row button{min-width:76px;padding:9px}
 .progress{margin:8px 0 11px}
 .feedback{padding:9px;margin-top:8px}
}
@media(orientation:landscape) and (max-height:520px){
 .app{max-width:1100px;padding:6px 12px}
 .panel,.card{padding:9px;margin-bottom:7px}
 .prompt{font-size:38px;margin:3px 0 7px}
 .glosses{margin:5px 0}
 .gloss{padding:5px 8px}
 .progress{margin:6px 0 8px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>한문 퀴즈</h1>
    <div class="small">훈음 · 단어 · 사자성어 음쓰기</div>
  </div>
  <strong id="counts" class="small"></strong>
</header>

<section class="panel" id="setup">
  <h2>퀴즈 설정</h2>
  <div class="grid">
    <label class="field">문제 종류
      <select id="kind">
        <option value="char">글자</option>
        <option value="word">단어</option>
        <option value="idiom" selected>사자성어</option>
      </select>
    </label>
    <label class="field">퀴즈 모드
      <select id="mode">
        <option value="reading">보고 음 쓰기</option>
      </select>
    </label>
    <label class="field">출제 순서
      <select id="order">
        <option value="random">무작위</option>
        <option value="list">목록 순</option>
      </select>
    </label>
  </div>
  <p class="small" id="modeHelp">한자어를 보고 음을 입력합니다. 글자 모드에서는 뜻과 음을 입력합니다.</p>
</section>

<section class="panel" id="rangesPanel">
  <h2>범위 선택 <span class="small">(여러 범위 선택 가능 · 10개씩 구분)</span></h2>
  <div class="range-groups" id="ranges"></div>
  <p class="small" id="rangeSummary"></p>
  <div class="buttons">
    <button class="outline" id="allRanges">전체 선택</button>
    <button class="outline" id="noRanges">선택 해제</button>
    <button class="primary" id="start">퀴즈 시작</button>
  </div>
</section>

<section class="card hidden" id="quiz">
  <div class="meta"><span id="quizType"></span><span id="position"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="prompt-label" id="questionLabel"></div>
  <div class="prompt" id="question"></div>
  <div class="hint" id="hint"></div>
  <div id="glosses" class="glosses"></div>
  <div class="answer-row">
    <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
    <button class="primary" id="check">확인</button>
  </div>
  <div id="feedback" class="feedback hidden" aria-live="polite"></div>
  <div class="buttons" style="justify-content:space-between;margin-top:10px">
    <button class="outline" id="prev">← 이전</button>
    <div class="buttons">
      <button class="secondary" id="skip">건너뛰기</button>
      <button class="primary hidden" id="next">다음 →</button>
    </div>
  </div>
  <p class="small">Enter: 정답 확인 → 다음 문제. 입력창의 초점을 유지하도록 설정했습니다.</p>
</section>

<section class="card hidden" id="results">
  <h2>결과</h2>
  <div class="stats">
    <div class="stat"><b id="total">0</b><span>전체</span></div>
    <div class="stat"><b id="right">0</b><span>정답</span></div>
    <div class="stat"><b id="wrong">0</b><span>오답·미응답</span></div>
  </div>
  <div class="buttons" style="margin-top:12px">
    <button class="primary" id="retry">오답만 다시 풀기</button>
    <button class="secondary" id="restart">같은 문제 다시 풀기</button>
    <button class="outline" id="back">설정으로</button>
  </div>
  <div id="resultList"></div>
</section>
</div>

function norm(s){
  return String(s||"").replace(/\s+/g,"").replace(/[·ㆍ,，。.!！?？]/g,"").toLowerCase();
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function unique(a){
  const m=new Map();
  a.forEach(x=>m.set(x.hanja,x));
  return [...m.values()];
}

/* 종류별 자료를 10개씩 나누며 각 범위를 독립적으로 선택할 수 있습니다. */
function renderRanges(){
  const wrap=$("ranges");
  wrap.innerHTML="";
  Object.keys(data).forEach(kind=>{
    const group=document.createElement("div");
    group.className="range-group";

    const title=document.createElement("h3");
    title.textContent=`${labels[kind]} · ${data[kind].length}개`;
    group.appendChild(title);

    const list=document.createElement("div");
    list.className="ranges";

    for(let start=0;start<data[kind].length;start+=10){
      const end=Math.min(start+10,data[kind].length);
      const label=document.createElement("label");
      const input=document.createElement("input");
      input.type="checkbox";
      input.checked=true;
      input.className="range-check";
      input.dataset.kind=kind;
      input.dataset.start=start;
      input.dataset.end=end;

      const text=document.createElement("span");
      text.textContent=`${start+1}–${end}`;
      label.append(input,text);
      list.appendChild(label);
    }
    group.appendChild(list);
    wrap.appendChild(group);
  });
  updateRangeSummary();
}

function updateRangeSummary(){
  const totals={char:0,word:0,idiom:0};
  document.querySelectorAll(".range-check:checked").forEach(b=>{
    totals[b.dataset.kind]+=Number(b.dataset.end)-Number(b.dataset.start);
  });
  $("rangeSummary").textContent=
    `선택 범위: 글자 ${totals.char}개 · 단어 ${totals.word}개 · 사자성어 ${totals.idiom}개`;
}
$("ranges").addEventListener("change",updateRangeSummary);
$("allRanges").onclick=()=>{
  document.querySelectorAll(".range-check").forEach(x=>x.checked=true);
  updateRangeSummary();
};
$("noRanges").onclick=()=>{
  document.querySelectorAll(".range-check").forEach(x=>x.checked=false);
  updateRangeSummary();
};

function getSelected(){
  const kind=$("kind").value;
  let out=[];
  document.querySelectorAll(".range-check:checked").forEach(b=>{
    if(b.dataset.kind===kind){
      out.push(...data[kind].slice(Number(b.dataset.start),Number(b.dataset.end)));
    }
  });
  return unique(out);
}

function startQuiz(items=null,isReview=false){
  const kind=$("kind").value;
  let selected=items||getSelected();

  if(!selected.length){
    alert("현재 종류의 범위를 하나 이상 선택해 주세요.");
    return;
  }

  if(!items&&$("order").value==="random"){
    selected=shuffle([...selected]);
  }

  current=selected.map(x=>({...x}));
  index=0;
  checked=false;
  reviewOnly=isReview;
  records=current.map(()=>({status:"unanswered",input:""}));

  lastConfig={
    kind,
    mode:"reading",
    order:$("order").value,
    items:[...current]
  };

  $("setup").classList.add("hidden");
  $("rangesPanel").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("results").classList.add("hidden");

  renderQuestion();
  focusAnswer();
}

  return Array.from(item.hanja).map(h=>{
    const info=charMeaning(h);
    return {hanja:h,meaning:info[0],reading:info[1]};
  });
}
function getQuestionData(item){
  if(item.type==="char"){
    return {
      label:"뜻과 음을 모두 입력하세요",
      hint:"예: 나무목 (띄어쓰기 없이)",
      answer:item.meaning+item.reading
    };
  }
  return {
    label:item.type==="idiom"
      ?"고사성어를 보고 음을 입력하세요"
      :"한자어를 보고 음을 입력하세요",
    hint:"한자어 전체의 음을 입력하세요",
    answer:item.reading
  };
}

function renderQuestion(){
  if(index>=current.length){
    showResults();
    return;
  }

  const item=current[index];
  const q=getQuestionData(item);
  checked=records[index].status!=="unanswered";

  $("quizType").textContent=labels[item.type]+(reviewOnly?" · 오답 복습":"");
  $("position").textContent=`${index+1} / ${current.length}`;
  $("bar").style.width=`${(index+1)/current.length*100}%`;
  $("questionLabel").textContent=q.label;
  $("question").textContent=item.hanja;
  $("hint").textContent=q.hint;
  $("glosses").innerHTML="";

  $("answer").value=records[index].input||"";
  $("feedback").className="feedback hidden";
  $("feedback").textContent="";
  $("check").classList.toggle("hidden",checked);
  $("next").classList.toggle("hidden",!checked);
  $("next").textContent=index===current.length-1?"결과 보기 →":"다음 →";
  $("prev").disabled=index===0;

  current[index]._questionData=q;
  if(checked)showFeedback(item,q,records[index]);
}

function isCorrect(typed,answer){
  return norm(typed)===norm(answer);
}

function showFeedback(item,q,rec){
  const fb=$("feedback");
  fb.className="feedback "+(
    rec.status==="correct"?"correct":
    rec.status==="wrong"?"wrong":"neutral"
  );

  fb.textContent=
    (rec.status==="correct"?"정답입니다!":
     rec.status==="wrong"?"다시 확인해 보세요.":"건너뛴 문제입니다.")+
    "\n정답: "+q.answer+
    (item.meaning?"\n전체 뜻: "+item.meaning:"");

  fb.classList.remove("hidden");
}

function focusAnswer(){
  requestAnimationFrame(()=>{
    const input=$("answer");
    if(document.activeElement!==input){
      input.focus({preventScroll:true});
    }
  });
}

function checkAnswer(){
  if(checked){
    goNext();
    return;
  }

  const item=current[index];
  const q=item._questionData||getQuestionData(item);
  const typed=$("answer").value;

  records[index]={
    status:isCorrect(typed,q.answer)?"correct":"wrong",
    input:typed
  };
  checked=true;

  showFeedback(item,q,records[index]);
  $("check").classList.add("hidden");
  $("next").classList.remove("hidden");
  $("next").textContent=index===current.length-1?"결과 보기 →":"다음 →";

  focusAnswer();
}

function goNext(){
  if(!checked){
    checkAnswer();
    return;
  }
  index++;
  if(index>=current.length){
    showResults();
    return;
  }
  renderQuestion();
  focusAnswer();
}

$("check").onclick=checkAnswer;
$("next").onclick=goNext;

$("answer").addEventListener("input",()=>{
  records[index].input=$("answer").value;

  if(checked){
    checked=false;
    records[index].status="unanswered";
    $("feedback").className="feedback hidden";
    $("check").classList.remove("hidden");
    $("next").classList.add("hidden");
  }
});

/* Enter는 폼 제출을 막고 확인/다음 동작만 실행합니다. */
$("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    e.stopPropagation();

    if(!checked)checkAnswer();
    else goNext();

    if(document.activeElement!==$("answer"))focusAnswer();
  }
});

$("prev").onclick=()=>{
  if(index>0){
    records[index].input=$("answer").value;
    index--;
    renderQuestion();
    focusAnswer();
  }
};

$("skip").onclick=()=>{
  if(!checked){
    records[index]={
      status:"unanswered",
      input:$("answer").value
    };
    checked=true;
    showFeedback(
      current[index],
      current[index]._questionData||getQuestionData(current[index]),
      records[index]
    );
    $("check").classList.add("hidden");
    $("next").classList.remove("hidden");
    $("next").textContent=index===current.length-1?"결과 보기 →":"다음 →";
    focusAnswer();
  }else{
    goNext();
  }
};

function showResults(){
  $("quiz").classList.add("hidden");
  $("results").classList.remove("hidden");

  const correct=records.filter(x=>x.status==="correct").length;
  $("total").textContent=current.length;
  $("right").textContent=correct;
  $("wrong").textContent=current.length-correct;
  $("retry").disabled=!records.some(x=>x.status!=="correct");

  const list=$("resultList");
  list.innerHTML="";

  current.forEach((item,i)=>{
    const q=item._questionData||getQuestionData(item);
    const rec=records[i];
    const el=document.createElement("div");
    el.className="result-item";

    const status=rec.status==="correct"?"정답":
      rec.status==="wrong"?"오답":"미응답";

    el.innerHTML=`<strong>${i+1}. ${escapeHtml(item.hanja)} — ${status}</strong><br>
      내 답: ${escapeHtml(rec.input||"(입력 없음)")}<br>
      정답: ${escapeHtml(String(q.answer))}<br>
      전체 뜻: ${escapeHtml(item.meaning||"뜻 자료 없음")}`;

    list.appendChild(el);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

$("start").onclick=()=>startQuiz();

$("retry").onclick=()=>{
  const bad=current.filter((x,i)=>records[i].status!=="correct");
  if(!bad.length)return;

  $("kind").value=bad[0].type;
  updateModeOptions();
  startQuiz(bad,true);
};

$("restart").onclick=()=>{
  if(lastConfig){
    $("kind").value=lastConfig.kind;
    $("mode").value="reading";
    $("order").value=lastConfig.order;
    startQuiz([...lastConfig.items]);
  }
};

$("back").onclick=()=>{
  $("results").classList.add("hidden");
  $("setup").classList.remove("hidden");
  $("rangesPanel").classList.remove("hidden");
};

$("counts").textContent=`${chars.length}자 · ${words.length}단어 · ${idioms.length}성어`;
renderRanges();
updateModeOptions();
</script>
</body>
</html>
